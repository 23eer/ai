<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朱雨欣</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e7e9ea;
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    z-index: 2;
  }

  /* ============ 顶部 ============ */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.3rem 0.8rem;
    border-bottom: 1px solid #1c1f22;
    flex-shrink: 0;
  }

  .her-name {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .her-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a7a9a, #3a4560);
    border: 1px solid #2a3346;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: #c9d3e6;
  }

  .affection {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.8rem; color: #8a92a6; letter-spacing: 0.05em;
  }
  .affection .num {
    font-size: 1.05rem; font-weight: 700;
    color: #ff6b9d;
    min-width: 2ch; text-align: right;
    display: inline-block;
    transition: color 0.3s ease;
  }
  .affection .num.bump {
    animation: bump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .affection .num.down { color: #6a7280; }
  @keyframes bump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .bar {
    width: 90px; height: 4px;
    background: #1c1f22;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff6b9d, #ff9ec4);
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ============ 中间：滚动区 ============ */
  .scene {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 1.4rem 1.4rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-height: 0;
  }
  .scene::-webkit-scrollbar { width: 0; }
  .scene { scrollbar-width: none; }

  .desc {
    font-size: 0.92rem; line-height: 1.9;
    color: #8a92a6; letter-spacing: 0.03em;
    white-space: pre-line;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* 动作描述（你做了什么）：小字灰色，左对齐 */
  .act {
    font-size: 0.88rem; line-height: 1.8;
    color: #7a8296; letter-spacing: 0.04em;
    font-style: italic;
    white-space: pre-line;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* 她说的话 */
  .say {
    font-size: 1.08rem; line-height: 1.9;
    color: #e7e9ea; letter-spacing: 0.04em;
    padding: 0.95rem 1.15rem;
    background: rgba(30, 36, 46, 0.6);
    border-left: 2px solid #4a5a7a;
    border-radius: 0 12px 12px 0;
    white-space: pre-line;
    opacity: 0;
    animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .say .name {
    display: block;
    font-size: 0.78rem; color: #ff9ec4;
    letter-spacing: 0.2em; margin-bottom: 0.35rem;
  }

  /* 你的选择回显 */
  .did {
    align-self: flex-end;
    font-size: 0.92rem; line-height: 1.7;
    color: #aeb6c6;
    background: rgba(47, 111, 237, 0.14);
    border: 1px solid rgba(47, 111, 237, 0.3);
    border-radius: 12px 12px 0 12px;
    padding: 0.7rem 1rem;
    max-width: 82%;
    white-space: pre-line;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes rise {
    0%   { opacity: 0; transform: translateY(12px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* ============ 底部选项 ============ */
  .choices {
    flex-shrink: 0;
    padding: 0.9rem 1.3rem calc(1.2rem + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 0.65rem;
    background: #000;
    border-top: 1px solid #121417;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    max-height: 55vh;
    overflow-y: auto;
  }
  .choices::-webkit-scrollbar { width: 0; }
  .choices { scrollbar-width: none; }
  .choices.show { opacity: 1; pointer-events: auto; }

  .choice {
    padding: 0.9rem 1.05rem;
    background: rgba(28, 31, 34, 0.9);
    border: 1px solid #2f3336;
    border-radius: 14px;
    color: #c8ccd1;
    font-size: 0.93rem; line-height: 1.5;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    opacity: 0; transform: translateY(8px);
  }
  .choice.show { opacity: 1; transform: translateY(0); transition: all 0.5s cubic-bezier(0.16,1,0.3,1); }
  .choice:hover { background: rgba(40, 46, 54, 0.95); border-color: #4a9eff; color: #e7e9ea; }
  .choice:active { transform: scale(0.985); }

  .restart {
    position: absolute;
    top: 1rem; right: 1rem;
    z-index: 30;
    font-size: 0.72rem; color: #8a92a6;
    border: 1px solid #2f3336; border-radius: 999px;
    padding: 0.35rem 0.85rem;
    background: #0a0a0a; cursor: pointer;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .restart.show { opacity: 1; }
  .restart:hover { color: #e7e9ea; border-color: #4a9eff; }

  .breath {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, rgba(60,70,90,0.12) 0%, rgba(0,0,0,0) 65%);
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity: 0.5; }
    50%     { opacity: 1; }
  }

  @media (min-width: 640px) {
    .stage {
      top: 50%; left: 50%; right: auto; bottom: auto;
      transform: translate(-50%, -50%);
      height: 92vh; max-height: 840px;
      border-radius: 36px;
      border: 1px solid #1c1f22;
      box-shadow: 0 40px 90px rgba(0,0,0,0.85);
      overflow: hidden;
    }
  }
</style>
</head>
<body>

<div class="breath"></div>

<div class="stage">

  <div class="topbar">
    <div class="her-name">
      <div class="her-avatar">雨欣</div>
      朱雨欣
    </div>
    <div class="affection">
      <span>心动</span>
      <div class="bar"><div class="fill" id="barFill"></div></div>
      <span class="num" id="affNum">0</span>
    </div>
  </div>

  <div class="scene" id="scene"></div>

  <div class="choices" id="choices"></div>

  <div class="restart" id="restart">↻ 重新开始</div>

</div>

<script>
/* =========================================
   攻略朱雨欣 · 多分支版
   ========================================= */
const sceneEl   = document.getElementById('scene');
const choicesEl = document.getElementById('choices');
const affNumEl  = document.getElementById('affNum');
const barFillEl = document.getElementById('barFill');
const restartEl = document.getElementById('restart');

let affection = 0;
let ended = false;
let busy = false;

function scrollToBottom() {
  requestAnimationFrame(() => {
    sceneEl.scrollTop = sceneEl.scrollHeight;
  });
}

function changeAffection(delta) {
  affection = Math.max(0, Math.min(100, affection + delta));
  affNumEl.textContent = affection;
  barFillEl.style.width = affection + '%';
  if (affection < 40) affNumEl.classList.add('down');
  else affNumEl.classList.remove('down');
  affNumEl.classList.remove('bump');
  void affNumEl.offsetWidth;
  affNumEl.classList.add('bump');
}

function appendDesc(text) {
  const el = document.createElement('div');
  el.className = 'desc';
  el.textContent = text;
  sceneEl.appendChild(el);
  scrollToBottom();
}
function appendAct(text) {
  const el = document.createElement('div');
  el.className = 'act';
  el.textContent = text;
  sceneEl.appendChild(el);
  scrollToBottom();
}
function appendSay(text) {
  const el = document.createElement('div');
  el.className = 'say';
  el.innerHTML = '<span class="name">朱雨欣</span>' + escapeHtml(text);
  sceneEl.appendChild(el);
  scrollToBottom();
}
function appendDid(text) {
  const el = document.createElement('div');
  el.className = 'did';
  el.textContent = text;
  sceneEl.appendChild(el);
  scrollToBottom();
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

/* =========================================
   剧情 —— 7 个场景，每场 3~4 个选项
   每个选项可以有：text（你做的事）
                 act（动作描述，可选）
                 say（她说的话，可选）
                 aff（心动值变化）
                 next（下一场景）
   ========================================= */
const story = {

  /* ---------- 1. 图书馆初遇 ---------- */
  start: {
    desc: "九月。图书馆最里面一排书架。\n窗边坐着一个女生，头发扎得很松，桌上摊着一本《雨》。",
    say: "……你也来看这本？",
    choices: [
      { text: "「嗯，听说很好看。」", act: "你把书从架上抽出来，翻到扉页。", aff: +5, next: "nod" },
      { text: "「不好意思，随便看看。」", act: "你往后退了半步，手插回口袋。", aff: 0, next: "nod" },
      { text: "「你也在看，那我换一本。」", act: "你把书塞回原位，准备走。", aff: -4, next: "nod" },
      { text: "不说话，把《雨》的另一本抽出来。", act: "你在她对面坐下，把书翻开，没看她。", aff: +3, next: "nod" }
    ]
  },

  /* ---------- 2. 扉页名字 ---------- */
  nod: {
    desc: "她把书往你那边推了推。\n扉页上写着两个字：朱雨欣。",
    say: "雨欣。下雨的雨，欣欣向荣的欣。",
    choices: [
      { text: "「名字很好听。」", act: "你把书推回去，指尖碰到她的。", aff: +8, next: "name" },
      { text: "「朱雨欣。我记住了。」", act: "你把名字念出来，声音很轻。", aff: +6, next: "name" },
      { text: "「哦。」", act: "你低下头，继续翻书。", aff: -5, next: "name" },
      { text: "把扉页上的名字抄在自己的本子上。", act: "你撕下一角，写了三个字，夹进书里。", aff: +10, next: "name" }
    ]
  },

  /* ---------- 3. 下雨不躲 ---------- */
  name: {
    desc: "她笑了一下，很轻。\n雨从窗外斜进来，她没关窗。",
    say: "你不觉得……下雨天很适合躲起来吗。",
    choices: [
      { text: "「不躲。我想站在这儿。」", act: "你把伞合上，放在脚边。", aff: +12, next: "window" },
      { text: "「躲累了，总得出来透透气。」", act: "你往窗边靠近一步。", aff: +6, next: "window" },
      { text: "「躲起来挺好的，谁都别找。」", act: "你把窗轻轻关上。", aff: -4, next: "window" },
      { text: "没说话，伸手把窗关上了一半。", act: "雨打在你的手背上，你没缩。", aff: +4, next: "window" }
    ]
  },

  /* ---------- 4. 她要走 ---------- */
  window: {
    desc: "雨停了。天没亮，灯也没开。\n她站起来，抱着书，像是要走了。",
    say: "……那我先走了。",
    choices: [
      { text: "「我送你。」", act: "你合上书，跟上她。", aff: +12, next: "walk" },
      { text: "「下次还来这儿吗？」", act: "你站在原地，没动。", aff: +7, next: "walk" },
      { text: "「嗯，再见。」", act: "你坐回原位，翻开书。", aff: -3, next: "walk" },
      { text: "「等一下——」", act: "你脱口而出，她停住了。", aff: +9, next: "wait" }
    ]
  },

  /* ---------- 4-支线：她真的停下了 ---------- */
  wait: {
    desc: "她真的停下来了。\n走廊的灯坏了一盏，剩下的那盏忽明忽暗。",
    say: "……怎么了。",
    choices: [
      { text: "「没什么。就是不想你走。」", act: "你看着她，没移开眼睛。", aff: +12, next: "walk" },
      { text: "「路上小心。」", act: "你摆了摆手。", aff: +2, next: "walk" },
      { text: "「你的书，忘拿了。」", act: "你举起她落在桌上的那本《雨》。", aff: +8, next: "walk" }
    ]
  },

  /* ---------- 5. 走廊尽头 ---------- */
  walk: {
    desc: "走廊尽头，她忽然停下来。\n外面的路灯把她的影子拉得很长。",
    say: "你为什么，一直看着我。",
    choices: [
      { text: "「因为我想看清楚你。」", act: "你往前走了一步。", aff: +15, next: "rain" },
      { text: "「因为你像一个人。」", act: "你低下头，声音很轻。", aff: +3, next: "rain" },
      { text: "「没有，我没看你。」", act: "你侧过身，让开路。", aff: -8, next: "rain" },
      { text: "什么都没说，只是把手插进口袋。", act: "你和她隔着一步的距离，谁都没动。", aff: +5, next: "rain" }
    ]
  },

  /* ---------- 6. 又下雨了 ---------- */
  rain: {
    desc: "走到门口的时候，又下起了雨。\n她站在屋檐下，看了一会儿天。",
    say: "又下了。",
    choices: [
      { text: "「我伞给你。」", act: "你把伞递过去，自己退后一步站进雨里。", aff: +15, next: "end" },
      { text: "「一起走吧。」", act: "你把伞撑开，往她那边偏了偏。", aff: +12, next: "end" },
      { text: "「那我先走了。」", act: "你撑开伞，走进雨里。", aff: -6, next: "end" },
      { text: "站在原地没动，陪她一起等。", act: "雨越下越大，你们谁都没说话。", aff: +8, next: "end" }
    ]
  },

  /* ---------- 结局节点 ---------- */
  end: {
    desc: "……",
    say: "",
    choices: [],
    final: true
  }
};

/* 结局文案 */
function finalText() {
  if (affection >= 80) {
    return {
      title: "HE · 雨欣",
      desc: "「那……明天还下雨吗。」\n「下。」\n「那我还在那儿等你。」",
      color: "#ff6b9d"
    };
  }
  if (affection >= 55) {
    return {
      title: "NE · 伞",
      desc: "她没回头，也没说再见。\n只是走之前，把伞留在了台阶上。",
      color: "#aeb6c6"
    };
  }
  if (affection >= 30) {
    return {
      title: "NE · 雨停之后",
      desc: "她说了句「再见」，\n然后就真的只是再见了。",
      color: "#8a92a6"
    };
  }
  return {
    title: "BE · 扉页",
    desc: "书还回来了。扉页上那两个字，\n被人用铅笔轻轻描了一遍，又擦掉了。",
    color: "#5a6270"
  };
}

/* =========================================
   渲染
   ========================================= */
function renderNode(key) {
  if (busy || ended) return;
  busy = true;

  const node = story[key];
  if (!node) { busy = false; return; }

  if (node.desc) appendDesc(node.desc);

  if (node.say) {
    setTimeout(() => {
      appendSay(node.say);
      setTimeout(() => {
        busy = false;
        if (node.final) showFinal();
        else showChoices(node.choices);
      }, 550);
    }, 450);
  } else {
    busy = false;
    if (node.final) showFinal();
  }
}

function showChoices(choices) {
  choicesEl.innerHTML = '';
  choicesEl.classList.add('show');

  choices.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.textContent = c.text;
    el.addEventListener('click', () => {
      if (busy) return;
      busy = true;

      appendDid(c.text);
      if (c.act) setTimeout(() => appendAct(c.act), 300);
      if (c.aff) setTimeout(() => changeAffection(c.aff), 350);

      choicesEl.classList.remove('show');
      choicesEl.innerHTML = '';
      scrollToBottom();

      setTimeout(() => {
        busy = false;
        renderNode(c.next);
      }, 1100);
    });
    choicesEl.appendChild(el);
    setTimeout(() => el.classList.add('show'), 70 * i);
  });
}

function showFinal() {
  ended = true;
  const f = finalText();

  const t = document.createElement('div');
  t.className = 'say';
  t.style.borderLeftColor = f.color;
  t.innerHTML = '<span class="name" style="color:' + f.color + '">' + f.title + '</span>' + escapeHtml(f.desc);
  sceneEl.appendChild(t);
  scrollToBottom();

  restartEl.classList.add('show');
}

function reset() {
  affection = 0;
  ended = false;
  busy = false;
  sceneEl.innerHTML = '';
  choicesEl.innerHTML = '';
  choicesEl.classList.remove('show');
  restartEl.classList.remove('show');
  affNumEl.textContent = '0';
  barFillEl.style.width = '0%';
  affNumEl.classList.remove('down');
  setTimeout(() => renderNode('start'), 300);
}
restartEl.addEventListener('click', reset);

window.addEventListener('load', () => {
  setTimeout(() => renderNode('start'), 500);
});
</script>
</body>
</html>
